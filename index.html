<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniMath: Adaptive Math Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
        }
        .math-font {
            font-family: 'Fira Code', monospace;
        }
        sup {
            font-size: 0.6em;
            color: #38bdf8; /* sky-400 */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        
        @keyframes pulse-border {
            0%, 100% { border-color: #10b981; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { border-color: #34d399; box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
        }
        .correct-pulse {
            animation: pulse-border 1.5s infinite;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }

        .streak-glow {
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.8);
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
            to { text-shadow: 0 0 20px rgba(245, 158, 11, 1), 0 0 30px rgba(245, 158, 11, 0.8); }
        }

        /* Fire Streak Vibe */
        .fire-text {
            background-image: linear-gradient(to top, #fbbf24, #ef4444);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 900;
        }
        @keyframes flicker {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            25% { opacity: 0.8; transform: scale(1.05) translateY(-2px); }
            50% { opacity: 0.9; transform: scale(0.95) translateY(1px); }
            75% { opacity: 1; transform: scale(1.02) translateY(-1px); }
            100% { opacity: 0.85; transform: scale(1) translateY(0); }
        }
        .fire-flicker {
            animation: flicker 0.15s infinite alternate;
            display: inline-block;
        }
        .intense-fire-glow {
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.8), 0 -10px 25px rgba(245, 158, 11, 0.9);
            animation: glow 0.8s ease-in-out infinite alternate;
        }

        /* Slider Custom Styling */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            transition: transform 0.1s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Main Game Area -->
        <div class="lg:col-span-2 glass-panel rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[750px]">
            
            <!-- Header & Stats -->
            <div class="bg-slate-900/80 p-6 border-b border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold bg-gradient-to-r from-sky-400 to-emerald-400 bg-clip-text text-transparent">
                        OmniMath
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">Adaptive Math Arena</p>
                </div>
                
                <div class="flex items-center gap-6 bg-slate-950/50 px-6 py-3 rounded-2xl border border-slate-800">
                    <div class="flex flex-col items-center">
                        <span class="text-slate-400 text-xs uppercase tracking-wider font-semibold">Streak</span>
                        <div class="flex items-center gap-1" id="streak-container">
                            <span id="streak-icon-left" class="text-xl hidden transition-all">🔥</span>
                            <span id="streak-counter" class="text-2xl font-bold text-sky-400 transition-colors duration-300">0</span>
                            <span id="streak-icon-right" class="text-xl hidden transition-all">🔥</span>
                        </div>
                    </div>
                    <div class="w-px h-8 bg-slate-800"></div>
                    <div class="flex flex-col items-center">
                        <span class="text-slate-400 text-xs uppercase tracking-wider font-semibold">Accuracy</span>
                        <span id="accuracy-counter" class="text-2xl font-bold text-emerald-400">0%</span>
                    </div>
                </div>
            </div>

            <!-- Difficulty Slider Panel -->
            <div class="px-6 py-4 bg-slate-900/60 border-b border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <span class="text-slate-400 text-sm font-semibold whitespace-nowrap">Difficulty:</span>
                    <span id="difficulty-label" class="text-sky-400 font-extrabold text-sm tracking-wider bg-sky-950/40 px-3 py-1 rounded-lg border border-sky-900/50">Middle School</span>
                </div>
                <div class="w-full md:w-2/3 flex items-center gap-4">
                    <span class="text-xs text-slate-500 font-bold uppercase tracking-wider">Preschool</span>
                    <input type="range" id="difficulty-slider" min="0" max="4" value="2" class="w-full h-2 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-sky-500">
                    <span class="text-xs text-slate-500 font-bold uppercase tracking-wider">College</span>
                </div>
            </div>

            <!-- Operations Tab Selector -->
            <div class="p-4 bg-slate-900/40 border-b border-slate-800 flex flex-wrap justify-center gap-2">
                <button id="btn-addition" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 border border-slate-700 hover:bg-slate-800 text-slate-300">
                    + Addition
                </button>
                <button id="btn-subtraction" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 border border-slate-700 hover:bg-slate-800 text-slate-300">
                    - Subtraction
                </button>
                <button id="btn-multiplication" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 border border-slate-700 hover:bg-slate-800 text-slate-300">
                    × Multiplication
                </button>
                <button id="btn-division" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 border border-slate-700 hover:bg-slate-800 text-slate-300">
                    ÷ Division
                </button>
                <button id="btn-pemdas" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 border border-slate-700 hover:bg-slate-800 text-slate-300">
                    ⚡ PEMDAS
                </button>
            </div>

            <!-- Main Problem Area -->
            <div class="flex-1 p-8 flex flex-col items-center justify-center relative">
                
                <!-- Problem Display -->
                <div id="problem-display" class="math-font text-3xl sm:text-4xl lg:text-5xl tracking-wide text-center leading-relaxed text-white mb-8 transition-opacity duration-300">
                    Loading...
                </div>

                <!-- Input & Actions -->
                <div class="w-full max-w-md flex flex-col gap-4">
                    <input 
                        type="number" 
                        id="answer-input" 
                        placeholder="Enter your answer..." 
                        class="w-full bg-slate-950 border-2 border-slate-700 rounded-2xl text-center text-3xl py-4 text-white placeholder-slate-600 focus:outline-none focus:border-sky-500 transition-colors shadow-inner"
                        autocomplete="off"
                        disabled
                    >
                    
                    <div class="flex gap-3">
                        <button id="submit-btn" class="flex-1 bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 px-6 rounded-2xl transition-colors shadow-lg shadow-sky-900/20 disabled:opacity-50" disabled>
                            Submit
                        </button>
                        <button id="give-up-btn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold py-4 px-6 rounded-2xl transition-colors disabled:opacity-50" disabled>
                            Reveal
                        </button>
                        <button id="next-btn" class="hidden flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-6 rounded-2xl transition-colors shadow-lg shadow-emerald-900/20">
                            Next Problem ➔
                        </button>
                    </div>
                </div>

                <!-- Feedback Message -->
                <div id="feedback-msg" class="mt-6 text-lg font-semibold text-center opacity-0 transition-opacity duration-300 h-8">
                    <!-- Feedback injected here -->
                </div>
            </div>
            
            <div class="p-4 bg-slate-900/40 text-center text-slate-500 text-xs">
                All problems are generated to yield positive integer values. Data is synced in real-time.
            </div>
        </div>

        <!-- Right Column: History Panel -->
        <div class="glass-panel rounded-3xl shadow-2xl flex flex-col h-[500px] lg:h-[750px] overflow-hidden">
            <div class="bg-slate-900/80 p-5 border-b border-slate-800">
                <h2 class="text-xl font-bold text-slate-200 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Past Responses
                </h2>
                <p class="text-xs text-slate-400 mt-1">Your saved history across sessions</p>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="history-list">
                <!-- History Items Injected Here -->
                <div class="text-center text-slate-500 italic mt-10" id="empty-history">
                    No history yet. Start solving!
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Setup ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const app = firebaseConfig ? initializeApp(firebaseConfig) : null;
        const auth = app ? getAuth(app) : null;
        const db = app ? getFirestore(app) : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let userId = null;
        let unsubscribeHistory = null;
        let authInitialized = false;
        let localHistory = [];

        // --- Core Utility Functions ---
        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Difficulty Metadata mapped to slider indices
        const difficultyLevels = [
            { name: "Preschool", labelColor: "text-pink-400 border-pink-900/50 bg-pink-950/20" },
            { name: "Elementary", labelColor: "text-green-400 border-green-900/50 bg-green-950/20" },
            { name: "Middle School", labelColor: "text-sky-400 border-sky-900/50 bg-sky-950/20" },
            { name: "High School", labelColor: "text-purple-400 border-purple-900/50 bg-purple-950/20" },
            { name: "College", labelColor: "text-amber-400 border-amber-900/50 bg-amber-950/20" }
        ];

        // --- Adaptive Multi-Level Math Problem Generators ---
        const templates = {
            // Level 0: Preschool (Index 0)
            0: {
                addition: [
                    () => { let a=rand(1,6), b=rand(1,3); return { q: `${a} + ${b}`, a: a+b, plain: `${a} + ${b}` }; }
                ],
                subtraction: [
                    () => { let a=rand(4,9), b=rand(1, 3); return { q: `${a} - ${b}`, a: a-b, plain: `${a} - ${b}` }; }
                ],
                multiplication: [
                    // Counting doubles
                    () => { let a=rand(1,5); return { q: `${a} &times; 2`, a: a*2, plain: `${a} × 2` }; }
                ],
                division: [
                    // Sharing in half
                    () => { let ans=rand(1,4), a=ans*2; return { q: `${a} &divide; 2`, a: ans, plain: `${a} ÷ 2` }; }
                ],
                pemdas: [
                    // Very simple sequential operations
                    () => { let a=rand(1,5), b=rand(1,2); return { q: `${a} + ${b}`, a: a+b, plain: `${a} + ${b}` }; }
                ]
            },
            // Level 1: Elementary (Index 1)
            1: {
                addition: [
                    () => { let a=rand(10,89), b=rand(10,89); return { q: `${a} + ${b}`, a: a+b, plain: `${a} + ${b}` }; }
                ],
                subtraction: [
                    () => { let a=rand(20,99), b=rand(1, a-1); return { q: `${a} - ${b}`, a: a-b, plain: `${a} - ${b}` }; }
                ],
                multiplication: [
                    () => { let a=rand(2,10), b=rand(2,10); return { q: `${a} &times; ${b}`, a: a*b, plain: `${a} × ${b}` }; }
                ],
                division: [
                    () => { let b=rand(2,9), ans=rand(2,9), a=b*ans; return { q: `${a} &divide; ${b}`, a: ans, plain: `${a} ÷ ${b}` }; }
                ],
                pemdas: [
                    () => { let a=rand(2,5), b=rand(2,5), c=rand(1,10); return { q: `${a} &times; ${b} + ${c}`, a: a*b+c, plain: `${a} × ${b} + ${c}` }; }
                ]
            },
            // Level 2: Middle School (Index 2)
            2: {
                addition: [
                    () => { let a=rand(50, 999), b=rand(50, 999); return { q: `${a} + ${b}`, a: a+b, plain: `${a} + ${b}` }; },
                    () => { let a=rand(10, 200), b=rand(10, 200), c=rand(10, 200); return { q: `${a} + ${b} + ${c}`, a: a+b+c, plain: `${a} + ${b} + ${c}` }; }
                ],
                subtraction: [
                    () => { let a=rand(100, 999), b=rand(10, a-1); return { q: `${a} - ${b}`, a: a-b, plain: `${a} - ${b}` }; },
                    () => { let a=rand(100, 500), b=rand(20, 100), c=rand(10, a-b-1); return { q: `${a} - ${b} - ${c}`, a: a-b-c, plain: `${a} - ${b} - ${c}` }; }
                ],
                multiplication: [
                    () => { let a=rand(11, 99), b=rand(3, 9); return { q: `${a} &times; ${b}`, a: a*b, plain: `${a} × ${b}` }; },
                    () => { let a=rand(10, 30), b=rand(10, 20); return { q: `${a} &times; ${b}`, a: a*b, plain: `${a} × ${b}` }; }
                ],
                division: [
                    () => { let b=rand(2, 12), ans=rand(2, 15), a=b*ans; return { q: `${a} &divide; ${b}`, a: ans, plain: `${a} ÷ ${b}` }; },
                    () => { let b=rand(4, 25), ans=rand(10, 40), a=b*ans; return { q: `${a} &divide; ${b}`, a: ans, plain: `${a} ÷ ${b}` }; }
                ],
                pemdas: [
                    () => { let a=rand(2,12), b=rand(2,12), c=rand(5,50); return { q: `${a} &times; ${b} + ${c}`, a: a*b+c, plain: `${a} × ${b} + ${c}` }; },
                    () => { let a=rand(5,20), b=rand(2,10), c=rand(2,6); return { q: `(${a} + ${b}) &times; ${c}`, a: (a+b)*c, plain: `(${a} + ${b}) × ${c}` }; },
                    () => { let b=rand(2,10), ans=rand(2,10), a=b*ans, c=rand(5,30); return { q: `${a} &divide; ${b} + ${c}`, a: ans+c, plain: `${a} ÷ ${b} + ${c}` }; },
                    () => { let a=rand(2,8), b=rand(10,30), c=rand(2, b-2); return { q: `${a} &times; (${b} - ${c})`, a: a*(b-c), plain: `${a} × (${b} - ${c})` }; },
                    () => { let a=rand(3,10), b=rand(5,30); return { q: `${a}<sup>2</sup> + ${b}`, a: (a*a)+b, plain: `${a}² + ${b}` }; }
                ]
            },
            // Level 3: High School (Index 3)
            3: {
                addition: [
                    () => { let a=rand(-99, -10), b=rand(110, 300); return { q: `|${a}| + ${b}`, a: Math.abs(a)+b, plain: `|${a}| + ${b}` }; }
                ],
                subtraction: [
                    () => { let a=rand(100, 500), b=rand(-150, -20); return { q: `${a} - (${b})`, a: a - b, plain: `${a} - (${b})` }; }
                ],
                multiplication: [
                    () => { let roots=[16, 25, 36, 49, 64, 81, 100, 121, 144]; let a=roots[rand(0, roots.length-1)]; let b=rand(5, 15); return { q: `&radic;${a} &times; ${b}`, a: Math.sqrt(a)*b, plain: `√${a} × ${b}` }; }
                ],
                division: [
                    () => { let b=rand(3,10), ans=rand(5,15), inner=Math.pow(b*ans, 2); return { q: `&radic;${inner} &divide; ${b}`, a: ans, plain: `√${inner} ÷ ${b}` }; }
                ],
                pemdas: [
                    () => {
                        let a = rand(2, 5), b = rand(2, 4), powVal = Math.pow(a, b);
                        let mult1 = rand(3, 8), mult2 = rand(3, 8), multVal = mult1 * mult2;
                        if (powVal <= multVal) {
                            return { q: `${powVal} + ${mult1} &times; ${mult2}`, a: powVal + multVal, plain: `${powVal} + ${mult1} × ${mult2}` };
                        }
                        return { q: `${a}<sup>${b}</sup> - ${mult1} &times; ${mult2}`, a: powVal - multVal, plain: `${a}^${b} - ${mult1} × ${mult2}` };
                    }
                ]
            },
            // Level 4: College (Index 4)
            4: {
                addition: [
                    // Sigma Notation Summation
                    () => { let a=rand(2, 10); return { q: `&sum;<sub>i=1</sub><sup>3</sup> (2i + ${a})`, a: 12 + 3*a, plain: `∑_{i=1}^3 (2i + ${a})` }; }
                ],
                subtraction: [
                    // Factorials subtraction
                    () => { let factorials=[1, 1, 2, 6, 24, 120, 720]; let a=rand(4,6), b=rand(2, a-1); return { q: `${a}! - ${b}!`, a: factorials[a]-factorials[b], plain: `${a}! - ${b}!` }; }
                ],
                multiplication: [
                    // 2x2 Determinant: ad - bc
                    () => {
                        let a=rand(4, 9), d=rand(4, 9);
                        let b=rand(1, 4);
                        let c=rand(1, Math.floor(((a*d)-2)/b));
                        const htmlStr = `det <span class="border-l-2 border-r-2 border-slate-400 px-2 inline-flex flex-col text-lg align-middle mx-1"><span class="flex justify-between gap-4"><span>${a}</span><span>${b}</span></span><span class="flex justify-between gap-4"><span>${c}</span><span>${d}</span></span></span>`;
                        return { q: htmlStr, a: (a*d)-(b*c), plain: `det([[${a}, ${b}], [${c}, ${d}]])` };
                    }
                ],
                division: [
                    // Logarithms
                    () => { let base=rand(2,5), exp=rand(2,4), val=Math.pow(base, exp), mult=rand(3,10); return { q: `log<sub>${base}</sub>(${val}) &times; ${mult}`, a: exp*mult, plain: `log_${base}(${val}) × ${mult}` }; }
                ],
                pemdas: [
                    // Mixed Factorials & Logarithms
                    () => {
                        let a=rand(4,5), b=rand(2,3);
                        let factorials=[1, 1, 2, 6, 24, 120, 720];
                        let logBase=rand(2,3), logPower=rand(2,3), logVal=Math.pow(logBase, logPower);
                        return { q: `(${a}! &divide; ${b}!) + log<sub>${logBase}</sub>(${logVal})`, a: (factorials[a]/factorials[b]) + logPower, plain: `(${a}! ÷ ${b}!) + log_${logBase}(${logVal})` };
                    }
                ]
            }
        };

        // --- Application State ---
        let currentLevelIndex = 2; // Default to Middle School
        let currentOperation = 'pemdas';
        let currentProblem = null;
        let stats = { streak: 0, correct: 0, total: 0, savedLevel: 2 };
        let isAnswered = false;

        // --- DOM Elements ---
        const uiDisplay = document.getElementById('problem-display');
        const uiInput = document.getElementById('answer-input');
        const uiSubmit = document.getElementById('submit-btn');
        const uiGiveUp = document.getElementById('give-up-btn');
        const uiNext = document.getElementById('next-btn');
        const uiFeedback = document.getElementById('feedback-msg');
        const uiStreak = document.getElementById('streak-counter');
        const uiStreakIconLeft = document.getElementById('streak-icon-left');
        const uiStreakIconRight = document.getElementById('streak-icon-right');
        const uiAccuracy = document.getElementById('accuracy-counter');
        const uiHistoryList = document.getElementById('history-list');
        const uiEmptyHistory = document.getElementById('empty-history');
        const uiDifficultySlider = document.getElementById('difficulty-slider');
        const uiDifficultyLabel = document.getElementById('difficulty-label');

        // --- Local Storage Sync Helpers ---
        function loadLocalData() {
            // Load stats locally instantly
            try {
                const savedStats = localStorage.getItem(`omnimath_stats_${appId}`);
                if (savedStats) {
                    stats = JSON.parse(savedStats);
                    if (stats.savedLevel !== undefined) {
                        currentLevelIndex = parseInt(stats.savedLevel, 10);
                        uiDifficultySlider.value = currentLevelIndex;
                    }
                    updateStatsUI();
                }
            } catch (e) {
                console.warn("Could not read local storage stats", e);
            }

            // Load history locally instantly
            try {
                const savedHist = localStorage.getItem(`omnimath_history_${appId}`);
                if (savedHist) {
                    localHistory = JSON.parse(savedHist);
                    renderHistoryList(localHistory);
                }
            } catch (e) {
                console.warn("Could not read local storage history", e);
            }

            // Always configure difficulty presentation on startup
            setGameConfigurationPresentation(currentLevelIndex, currentOperation);
        }

        // --- Authentication & DB Init ---
        const initAuth = async () => {
            // Enable inputs right away so it is always playable
            uiInput.disabled = false;
            uiSubmit.disabled = false;
            uiGiveUp.disabled = false;
            authInitialized = true;

            if (!auth) {
                console.warn("Firebase not configured. Using standalone local memory mode.");
                generateProblem();
                return;
            }

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch(e) {
                console.error("Auth error", e);
                generateProblem();
            }
        };

        if (auth) {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    loadStats();
                    listenToHistory();
                }
            });
        }

        // --- Instant Setup ---
        loadLocalData();
        initAuth();

        // --- Firestore DB Operations ---
        async function loadStats() {
            if (!userId || !db) return;
            try {
                const statsRef = doc(db, 'artifacts', appId, 'users', userId, 'stats', 'main');
                const docSnap = await getDoc(statsRef);
                if (docSnap.exists()) {
                    stats = docSnap.data();
                    if (stats.savedLevel !== undefined) {
                        currentLevelIndex = stats.savedLevel;
                        uiDifficultySlider.value = currentLevelIndex;
                    }
                    updateStatsUI();
                    
                    // Keep local storage synchronized
                    localStorage.setItem(`omnimath_stats_${appId}`, JSON.stringify(stats));
                }
                setGameConfigurationPresentation(currentLevelIndex, currentOperation);
                generateProblem();
            } catch (err) {
                console.error("Error loading stats from Firebase:", err);
                generateProblem();
            }
        }

        async function saveStats() {
            // Always save locally immediately
            try {
                localStorage.setItem(`omnimath_stats_${appId}`, JSON.stringify(stats));
            } catch (e) {}

            // Save to Firebase securely
            if (!userId || !db) return;
            try {
                const statsRef = doc(db, 'artifacts', appId, 'users', userId, 'stats', 'main');
                await setDoc(statsRef, stats);
            } catch (err) {
                console.error("Error saving stats:", err);
            }
        }

        async function addHistoryItem(problemPlain, userAns, actualAns, isCorrect) {
            const newItem = {
                problem: problemPlain,
                userAnswer: userAns,
                correctAnswer: actualAns,
                isCorrect: isCorrect,
                timestamp: Date.now()
            };

            // 1. Instantly update UI and Local Storage for zero-latency feedback
            localHistory.unshift(newItem);
            renderHistoryList(localHistory);
            try {
                localStorage.setItem(`omnimath_history_${appId}`, JSON.stringify(localHistory.slice(0, 100)));
            } catch (e) {}

            // 2. Queue Firestore Save in background
            if (!userId || !db) return;
            try {
                const histRef = collection(db, 'artifacts', appId, 'users', userId, 'history');
                await addDoc(histRef, newItem);
            } catch (err) {
                console.error("Error saving history to Firebase:", err);
            }
        }

        function listenToHistory() {
            if (!userId || !db) return;
            if (unsubscribeHistory) unsubscribeHistory();

            const histRef = collection(db, 'artifacts', appId, 'users', userId, 'history');
            
            unsubscribeHistory = onSnapshot(histRef, (snapshot) => {
                const firebaseHistory = [];
                snapshot.forEach(doc => firebaseHistory.push({ id: doc.id, ...doc.data() }));
                
                // Sort by timestamp descending
                firebaseHistory.sort((a, b) => b.timestamp - a.timestamp);
                
                // Merge cloud truth and local backup
                localHistory = firebaseHistory;
                renderHistoryList(localHistory);
                try {
                    localStorage.setItem(`omnimath_history_${appId}`, JSON.stringify(localHistory.slice(0, 100)));
                } catch(e) {}
            }, (error) => {
                console.error("Error listening to history:", error);
            });
        }

        // --- Game Setup Engine ---
        function setGameConfigurationPresentation(levelIdx, operation) {
            currentLevelIndex = parseInt(levelIdx, 10);
            currentOperation = operation;
            stats.savedLevel = currentLevelIndex;

            // Update active Difficulty Label
            const meta = difficultyLevels[currentLevelIndex];
            uiDifficultyLabel.innerText = meta.name;
            uiDifficultyLabel.className = `text-center font-extrabold text-sm tracking-wider px-3 py-1 rounded-lg border transition-all duration-300 ${meta.labelColor}`;

            // Update Operations Buttons Active Tab Styling
            const operations = ['addition', 'subtraction', 'multiplication', 'division', 'pemdas'];
            operations.forEach(op => {
                const el = document.getElementById(`btn-${op}`);
                if (op === operation) {
                    el.className = "px-4 py-2 rounded-xl text-sm font-bold transition-all duration-200 bg-sky-600 text-white shadow-lg shadow-sky-900/30";
                } else {
                    el.className = "px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 border border-slate-700 hover:bg-slate-800 text-slate-300";
                }
            });
        }

        function triggerGameConfiguration(levelIdx, operation) {
            setGameConfigurationPresentation(levelIdx, operation);
            saveStats();
            generateProblem();
        }

        function generateProblem() {
            isAnswered = false;
            uiInput.value = '';
            uiInput.disabled = false;
            uiInput.classList.remove('correct-pulse');
            uiInput.style.borderColor = '#334155'; // reset slate border
            uiInput.focus();
            
            uiSubmit.classList.remove('hidden');
            uiGiveUp.classList.remove('hidden');
            uiNext.classList.add('hidden');
            
            uiFeedback.style.opacity = '0';
            uiDisplay.style.opacity = '0';

            setTimeout(() => {
                const levelTemplates = templates[currentLevelIndex] || templates[2];
                const genList = levelTemplates[currentOperation] || levelTemplates['pemdas'];
                const generator = genList[Math.floor(Math.random() * genList.length)];
                currentProblem = generator();
                
                uiDisplay.innerHTML = currentProblem.q;
                uiDisplay.style.opacity = '1';
            }, 200);
        }

        function checkAnswer() {
            if (isAnswered || !uiInput.value.trim() || !currentProblem) return;
            
            const userAnswer = parseInt(uiInput.value, 10);
            if (isNaN(userAnswer)) {
                shakeInput();
                return;
            }

            stats.total++;
            isAnswered = true;
            uiInput.disabled = true;
            
            const isCorrect = (userAnswer === currentProblem.a);

            if (isCorrect) {
                stats.streak++;
                stats.correct++;
                uiInput.classList.add('correct-pulse');
                uiInput.style.borderColor = '#10b981';
                showFeedback(`Correct! Great calculation.`, 'text-emerald-400');
            } else {
                stats.streak = 0;
                shakeInput();
                uiInput.style.borderColor = '#ef4444';
                showFeedback(`Incorrect. The answer was ${currentProblem.a}.`, 'text-red-400');
            }

            // Sync State
            saveStats();
            addHistoryItem(currentProblem.plain, userAnswer, currentProblem.a, isCorrect);
            
            updateStatsUI();
            transitionToNextState();
        }

        function giveUp() {
            if (isAnswered || !currentProblem) return;
            
            stats.total++;
            stats.streak = 0;
            isAnswered = true;
            
            uiInput.value = currentProblem.a;
            uiInput.disabled = true;
            uiInput.style.borderColor = '#f59e0b'; // amber border
            
            showFeedback(`Answer revealed. It is ${currentProblem.a}.`, 'text-amber-400');
            
            saveStats();
            addHistoryItem(currentProblem.plain, "Skipped", currentProblem.a, false);
            
            updateStatsUI();
            transitionToNextState();
        }

        // --- Render past session cards ---
        function renderHistoryList(items) {
            uiHistoryList.innerHTML = '';
            if (items.length === 0) {
                uiHistoryList.appendChild(uiEmptyHistory);
                uiEmptyHistory.style.display = 'block';
                return;
            }
            
            uiEmptyHistory.style.display = 'none';
            const displayItems = items.slice(0, 40);

            displayItems.forEach(item => {
                const div = document.createElement('div');
                const isSkip = item.userAnswer === "Skipped";
                
                let borderColor = item.isCorrect ? 'border-emerald-500/50 bg-emerald-900/10' : 'border-red-500/50 bg-red-900/10';
                if (isSkip) borderColor = 'border-amber-500/50 bg-amber-900/10';

                let icon = item.isCorrect 
                    ? `<svg class="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`
                    : `<svg class="w-5 h-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>`;
                
                if (isSkip) {
                    icon = `<svg class="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
                }

                div.className = `p-3 rounded-xl border ${borderColor} flex items-center justify-between transition-all duration-300`;
                
                let answerText = `<span class="font-bold ${item.isCorrect ? 'text-emerald-300' : 'text-red-300 line-through mr-2'}">${item.userAnswer}</span>`;
                if (!item.isCorrect && !isSkip) {
                    answerText += `<span class="font-bold text-emerald-300">${item.correctAnswer}</span>`;
                }
                if (isSkip) {
                    answerText = `<span class="font-bold text-amber-300">Ans: ${item.correctAnswer}</span>`;
                }

                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        ${icon}
                        <span class="text-slate-200 font-mono text-xs sm:text-sm">${item.problem}</span>
                    </div>
                    <div class="text-sm font-mono text-right font-semibold">
                        ${answerText}
                    </div>
                `;
                uiHistoryList.appendChild(div);
            });
        }

        function shakeInput() {
            uiInput.classList.remove('shake');
            void uiInput.offsetWidth; 
            uiInput.classList.add('shake');
        }

        function showFeedback(text, colorClass) {
            uiFeedback.className = `mt-6 text-lg font-semibold text-center transition-opacity duration-300 h-8 ${colorClass}`;
            uiFeedback.innerText = text;
            uiFeedback.style.opacity = '1';
        }

        function transitionToNextState() {
            uiSubmit.classList.add('hidden');
            uiGiveUp.classList.add('hidden');
            uiNext.classList.remove('hidden');
            uiNext.focus();
        }

        function updateStatsUI() {
            uiStreak.innerText = stats.streak;
            
            // Streak Fire Effect Controller
            uiStreak.className = "text-2xl font-bold transition-colors duration-300";
            uiStreakIconLeft.classList.add('hidden');
            uiStreakIconRight.classList.add('hidden');
            uiStreakIconLeft.classList.remove('fire-flicker');
            uiStreakIconRight.classList.remove('fire-flicker');
            
            if (stats.streak >= 10) {
                // Intense Fire Level
                uiStreak.classList.add('fire-text', 'intense-fire-glow');
                uiStreakIconLeft.classList.remove('hidden');
                uiStreakIconRight.classList.remove('hidden');
                uiStreakIconLeft.classList.add('fire-flicker');
                uiStreakIconRight.classList.add('fire-flicker');
                uiStreakIconLeft.innerText = "☄️";
                uiStreakIconRight.innerText = "☄️";
            } else if (stats.streak >= 5) {
                // Medium Fire Level
                uiStreak.classList.add('fire-text', 'streak-glow');
                uiStreakIconLeft.classList.remove('hidden');
                uiStreakIconRight.classList.remove('hidden');
                uiStreakIconLeft.innerText = "🔥";
                uiStreakIconRight.innerText = "🔥";
            } else if (stats.streak >= 3) {
                // Low Fire Level
                uiStreak.classList.add('text-amber-400', 'streak-glow');
                uiStreakIconLeft.classList.remove('hidden');
                uiStreakIconLeft.innerText = "🔥";
            } else {
                uiStreak.classList.add('text-sky-400');
            }

            const accuracy = stats.total === 0 ? 0 : Math.round((stats.correct / stats.total) * 100);
            uiAccuracy.innerText = `${accuracy}%`;
            
            if (accuracy >= 80) uiAccuracy.className = "text-2xl font-bold text-emerald-400";
            else if (accuracy >= 50) uiAccuracy.className = "text-2xl font-bold text-amber-400";
            else uiAccuracy.className = "text-2xl font-bold text-red-400";
        }

        // --- Event Listeners ---
        uiDifficultySlider.addEventListener('input', (e) => {
            triggerGameConfiguration(e.target.value, currentOperation);
        });

        document.getElementById('btn-addition').addEventListener('click', () => triggerGameConfiguration(currentLevelIndex, 'addition'));
        document.getElementById('btn-subtraction').addEventListener('click', () => triggerGameConfiguration(currentLevelIndex, 'subtraction'));
        document.getElementById('btn-multiplication').addEventListener('click', () => triggerGameConfiguration(currentLevelIndex, 'multiplication'));
        document.getElementById('btn-division').addEventListener('click', () => triggerGameConfiguration(currentLevelIndex, 'division'));
        document.getElementById('btn-pemdas').addEventListener('click', () => triggerGameConfiguration(currentLevelIndex, 'pemdas'));
        
        uiSubmit.addEventListener('click', checkAnswer);
        uiGiveUp.addEventListener('click', giveUp);
        uiNext.addEventListener('click', generateProblem);

        uiInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkAnswer();
        });

    </script>
</body>
</html>
